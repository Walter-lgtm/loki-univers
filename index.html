<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERS LABORATORY | Гимназия №1</title>
    <link href="https://fonts.googleapis.com"

 rel="stylesheet">
    <style>
        :root {
            --bg: #0a0f1d;
            --accent: #00d4ff;
            --card-bg: #161f33;
            --text: #e2e8f0;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            width: 100%;
        }

        header h1 { 
            font-size: clamp(1.5rem, 8vw, 2.5rem); 
            letter-spacing: 4px; 
            margin: 0; 
            color: var(--accent);
            text-transform: uppercase;
        }

        header p { 
            font-size: clamp(0.7rem, 4vw, 0.9rem);
            opacity: 0.6; 
            margin-top: 10px;
            font-weight: 300;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            display: grid;
            /* Адаптивная сетка: 1 колонка на мобилках, 2 на планшетах, 4 на ПК */
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
        }

        .class-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 212, 255, 0.15);
            padding: clamp(30px, 10vh, 50px) 20px;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .class-card:active { transform: scale(0.95); }

        @media (min-width: 1024px) {
            .class-card:hover {
                transform: translateY(-10px);
                border-color: var(--accent);
                box-shadow: 0 15px 40px rgba(0, 212, 255, 0.15);
            }
        }

        .class-card h2 { 
            font-size: 1.4rem; 
            margin: 0;
            font-weight: 400;
        }

        /* Полноэкранное меню выбора модуля */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 29, 0.98);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .menu-title { 
            font-size: clamp(1.5rem, 7vw, 2.2rem); 
            margin-bottom: 40px; 
            color: var(--accent); 
            text-align: center;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .menu-btn {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 18px 25px;
            font-size: 0.9rem;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            transition: 0.3s;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .menu-btn:active, .menu-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .close-btn {
            margin-top: 50px;
            font-size: 0.8rem;
            opacity: 0.5;
            cursor: pointer;
            letter-spacing: 2px;
            padding: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>UNIVERS LABORATORY</h1>
    <p>DIGITAL CHEMISTRY • ГИМНАЗИЯ №1</p>
</header>

<div class="container">
    <div class="class-card" onclick="openMenu('8 класс', 'ВПР')"><h2>Химия 8 класс</h2></div>
    <div class="class-card" onclick="openMenu('9 класс', 'ОГЭ')"><h2>Химия 9 класс</h2></div>
    <div class="class-card" onclick="openMenu('10 класс', 'ВПР')"><h2>Химия 10 класс</h2></div>
    <div class="class-card" onclick="openMenu('11 класс', 'ЕГЭ')"><h2>Химия 11 класс</h2></div>
</div>

<div id="overlay">
    <div class="menu-title" id="menu-title">КЛАСС</div>
    <div class="btn-group">
        <a href="#" class="menu-btn" id="btn-lab">ЛАБОРАТОРИЯ АЛХИМИКА</a>
        <a href="#" class="menu-btn" id="btn-exam">ТРЕНАЖЕР</a>
        <a href="#" class="menu-btn" id="btn-quest">ТЕСТЫ-КВЕСТЫ</a>
    </div>
    <div class="close-btn" onclick="closeMenu()">← ВЕРНУТЬСЯ НАЗАД</div>
</div>

<script>
    function openMenu(className, examType) {
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('menu-title').innerText = className.toUpperCase();
        document.getElementById('btn-exam').innerText = 'ТРЕНАЖЕР ' + examType;
        
        let classNum = className.split(' ')[0]; // берем цифру класса
        document.getElementById('btn-lab').href = classNum + "-class/lab.html";
        document.getElementById('btn-exam').href = classNum + "-class/exam.html";
        document.getElementById('btn-quest').href = classNum + "-class/quest.html";
    }

    function closeMenu() {
        document.getElementById('overlay').style.display = 'none';
    }
</script>

</body>
</html>
