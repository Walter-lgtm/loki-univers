<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>L & ⅂ — МАГИСТРАТУМ: ПУТЬ АЛХИМИКА</title>
    <style>
        :root { --gem-color: #f6ad55; }
        body { background: #05070a; color: #e0e0e0; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #game-container { width: 900px; height: 750px; background: radial-gradient(circle at center, #1a1f26 0%, #05070a 100%); border: 2px solid #3d4b5c; border-radius: 20px; box-shadow: 0 0 100px rgba(0,0,0,1); position: relative; padding: 40px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        
        .gem-crystal { width: 160px; height: 160px; margin: 0 auto 20px; clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%); background: linear-gradient(145deg, var(--gem-color) 20%, #ffffff 50%, var(--gem-color) 80%); animation: pulse-rotate 4s infinite ease-in-out; filter: drop-shadow(0 0 30px var(--gem-color)); border: 2px solid rgba(255,255,255,0.4); }
        @keyframes pulse-rotate { 0%, 100% { transform: scale(1) rotate(0deg); filter: brightness(1); } 50% { transform: scale(1.1) rotate(10deg); filter: brightness(1.5); } }

        sub { font-size: 0.6em; vertical-align: sub; }
        .mystic-text { font-style: italic; color: #a0aec0; margin-bottom: 15px; font-size: 1.1em; line-height: 1.5; }
        .btn { background: #1c2533; border: 1px solid #4a5568; color: #cbd5e0; padding: 12px 24px; cursor: pointer; border-radius: 8px; font-size: 1em; transition: 0.4s; margin: 8px; }
        .btn:hover { background: #2d3748; color: #f6ad55; border-color: #f6ad55; transform: scale(1.05); }
        
        .door-btn { background: #1c2533; border: 2px solid #f6ad55; padding: 20px 10px; width: 140px; font-size: 0.8em; color: gold; transition: all 0.8s ease; opacity: 1; }
        .door-vanish { opacity: 0; transform: scale(0.5); pointer-events: none; }
        .door-selected { border-color: #00ffcc; box-shadow: 0 0 20px #00ffcc; transform: scale(1.1); }

        .hidden { display: none; }
        h1, h2 { color: #f6ad55; text-transform: uppercase; letter-spacing: 4px; }
        #final-message { color: #00ffcc; font-weight: bold; margin-top: 30px; font-size: 1.2em; text-shadow: 0 0 10px #00ffcc; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="screen-start">
        <h1>L & ⅂ — МАГИСТРАТУМ</h1>
        <p class="mystic-text">Приветствую Тебя, путник! Помни: <span style="color:#f6ad55; font-weight:bold;">«Нет Знаний, не дающих Силу»</span>.</p>
        <div style="display:flex; justify-content:center; gap:20px;">
            <button class="btn" onclick="nextScreen('lvl1')">Отправиться в путешествие</button>
            <button class="btn" onclick="quitGame()">Покинуть лабораторию</button>
        </div>
    </div>

   <div id="lvl-phenomena" class="hidden"></div>
    <div id="lvl1" class="hidden">
        <h2>Зал Разделения</h2>
        <p class="mystic-text" id="riddle-text"></p>
        <div id="riddle-options"></div>
    </div>

    <div id="lvl2" class="hidden">
        <h2>Кузня Валентности</h2>
        <p class="mystic-text">Собери верную формулу для оксида: <span id="target-element" style="color:#f6ad55;"></span></p>
        <div id="formula-options"></div>
    </div>

    <div id="lvl3" class="hidden">
    <!-- Теперь заполняется через setupLake() -->
</div>

    <div id="screen-final" class="hidden">
        <h2>Великое Делание</h2>
        <div id="gem-visual" class="gem-crystal"></div>
        <h3 id="gem-name"></h3>
        <p id="gem-desc" class="mystic-text"></p>
        <p id="door-title" style="color: gold;">Выбери свою Дверь Награды:</p>
        <div id="doors-container" style="display: flex; justify-content: center; gap: 10px;">
            <button class="btn door-btn" onclick="claim(this, 'Мудрости (5)')">Дверь Мудрости</button>
            <button class="btn door-btn" onclick="claim(this, 'Удачи (4)')">Дверь Удачи</button>
            <button class="btn door-btn" onclick="claim(this, 'Власти')">Дверь Власти</button>
            <button class="btn door-btn" onclick="claim(this, 'Иммунитета')">Дверь Иммунитета</button>
            <button class="btn door-btn" onclick="claim(this, 'Оракула')">Дверь Оракула</button>
        </div>
        <div id="final-message" class="hidden">Путник! Ты получил свою награду! Твоя Славная Миссия выполнена!</div>
    </div>
</div>

<script>
    const phenomena = [
    { text: "Горение магической свечи", type: "chem", desc: "Появился новый запах и свет — это химия!" },
    { text: "Плавление ледяного кристалла", type: "phys", desc: "Лишь форма изменилась, суть осталась водой." },
    { text: "Почернение медной чаши на огне", type: "chem", desc: "Медь соединилась с кислородом — новый налет!" },
    { text: "Растворение сахара в чае", type: "phys", desc: "Молекулы просто перемешались, это физика." },
    { text: "Скисание молока в кувшине", type: "chem", desc: "Образовался осадок и новый вкус — чистая реакция!" }
];
    const rewards = {
    'Мудрости (5)': "Философский Камень превратил Твои знания в золотую пятёрку! В журнале засияло золото.",
    'Удачи (4)': "Ты почти познал Великое Делание. Твоя награда — крепкая четвёрка и благословение Алхимика.",
    'Власти': "Ты обрел власть над стихиями! Твой авторитет в лаборатории непоколебим.",
    'Иммунитета': "Древний эликсир защитит тебя: сегодня ты застрахован от любых проклятий (двоек).",
    'Оракула': "Твой взор пронзает тайны: на следующем уроке ты будешь знать ответы до того, как их зададут."
};

// Проверяем наличие рейтинга в памяти
let leaderBoard = JSON.parse(localStorage.getItem('alchemist_rating')) || [];
    const riddles = [
        { q: "Алхимик в стоге сена потерял железную иглу. Как найти её быстрее всего?", right: "Сжечь сено и собрать пепел магнитом", wrong: ["Просеять сено", "Залить водой"] },
        { q: "В чаше смешаны песок и соль. Как вернуть алхимику чистую соль?", right: "Растворить, отфильтровать и выпарить", wrong: ["Пинцетом", "Магнитом"] },
        { q: "В кувшин с маслом попали тяжелые камни. Как очистить масло?", right: "Аккуратно слить масло (декантация)", wrong: ["Заморозить", "Выпарить"] }
    ];

    const oxides = [
    {el: "Алюминий (III)", right: "Al<sub>2</sub>O<sub>3</sub>", wrong: ["Al<sub>3</sub>O<sub>2</sub>", "AlO"]},
    {el: "Фосфор (V)", right: "P<sub>2</sub>O<sub>5</sub>", wrong: ["PO<sub>5</sub>", "P<sub>5</sub>O<sub>2</sub>"]},
    {el: "Натрий (I)", right: "Na<sub>2</sub>O", wrong: ["NaO<sub>2</sub>", "NaO"]}, // Исправлено NA -> Na
    {el: "Сера (VI)", right: "SO<sub>3</sub>", wrong: ["S<sub>2</sub>O<sub>6</sub>", "SO<sub>2</sub>"]}
];

    const gems = [
        {name: "Изумруд", color: "#2ecc71", desc: "Камень чистого знания. Твои навыки будут расти вечно."},
        {name: "Аметист", color: "#9b59b6", desc: "Камень ясности. Твой разум чист от сомнений."},
        {name: "Рубин", color: "#e74c3c", desc: "Пламя Жизни. Твоя энергия сокрушит любые преграды."},
        {name: "Сапфир", color: "#3498db", desc: "Синева Небес. Ты обрел истинную Базу знаний."},
        {name: "Малахит", color: "#16a085", desc: "Зелень жизни. Великая трансформация свершилась!"},
        {name: "Бирюза", color: "#1abc9c", desc: "Камень победы. Триумф знаний свершился!"}
    ];

    const indicators = [
    { name: "Фенолфталеин", effect: "Малиновый", logic: "right" },
    { name: "Лакмус", effect: "Синий", logic: "right" },
    { name: "Метиловый оранжевый", effect: "Желтый", logic: "right" },
    { name: "Универсальный индикатор", effect: "Сине-фиолетовый", logic: "right" }
];
    
    function nextScreen(id) {
    document.querySelectorAll('#game-container > div').forEach(div => div.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    if(id === 'lvl1') setupRiddle();
    if(id === 'lvl2') setupOxide();
    if(id === 'lvl3') setupLake(); // Новая функция для Озера
    if(id === 'screen-final') setupGem();
}

    function setupRiddle() {
        const rid = riddles[Math.floor(Math.random() * riddles.length)];
        document.getElementById('riddle-text').innerText = rid.q;
        const opts = [...rid.wrong, rid.right].sort(() => Math.random() - 0.5);
        document.getElementById('riddle-options').innerHTML = opts.map(o => 
            `<button class="btn" onclick="${o === rid.right ? "nextScreen('lvl2')" : "alert('Путь заблокирован! Попробуй снова.')"}">${o}</button>`
        ).join('');
    }

    function setupOxide() {
        const ox = oxides[Math.floor(Math.random() * oxides.length)];
        document.getElementById('target-element').innerText = ox.el;
        const opts = [...ox.wrong, ox.right].sort(() => Math.random() - 0.5);
        document.getElementById('formula-options').innerHTML = opts.map(o => 
            `<button class="btn" onclick="${o === ox.right ? "nextScreen('lvl3')" : "alert('Формула нестабильна!')"}">${o}</button>`
        ).join('');
    }

    function setupLake() {
    const lakeDiv = document.getElementById('lvl3');
    lakeDiv.innerHTML = `
        <h2>Озеро Базы</h2>
        <p class="mystic-text">Алхимику нужна едкая щелочь, но перед ним две колбы с прозрачной жидкостью. Какой артефакт поможет опознать щелочь?</p>
        <div id="indicator-options"></div>
    `;
    
    // Перемешиваем индикаторы и создаем кнопки
    const opts = [...indicators].sort(() => Math.random() - 0.5);
    document.getElementById('indicator-options').innerHTML = opts.map(ind => 
        `<button class="btn" onclick="checkIndicator('${ind.name}', '${ind.effect}')">${ind.name}</button>`
    ).join('');
}

function setupPhenomena() {
    const stage = phenomena[Math.floor(Math.random() * phenomena.length)];
    const lvl = document.getElementById('lvl-phenomena'); // Нужно добавить этот ID в HTML
    lvl.innerHTML = `
        <h2>Зал Трансмутаций</h2>
        <p class="mystic-text">Перед тобой явление: <b>${stage.text}</b>. Какова его природа?</p>
        <button class="btn" onclick="checkPhenom('${stage.type}', 'phys', '${stage.desc}')">Физическое</button>
        <button class="btn" onclick="checkPhenom('${stage.type}', 'chem', '${stage.desc}')">Химическое</button>
    `;
}

function checkPhenom(correct, chosen, desc) {
    if (correct === chosen) {
        alert("Верно! " + desc);
        nextScreen('lvl2'); // Ведем в Кузню Валентности
    } else {
        alert("Ошибся, путник! Энергия рассеялась. Попробуй снова.");
    }
}
    function checkIndicator(name, effect) {
    alert(`Раствор окрасился в ${effect} цвет! Истина открылась.`);
    nextScreen('screen-final');
}
    function setupGem() {
        const gem = gems[Math.floor(Math.random() * gems.length)];
        const v = document.getElementById('gem-visual');
        v.style.setProperty('--gem-color', gem.color);
        document.getElementById('gem-name').innerText = gem.name;
        document.getElementById('gem-name').style.color = gem.color;
        document.getElementById('gem-desc').innerText = gem.desc;
    }

    function claim(btn, reward) {
    // 1. Анимация выбора
    document.querySelectorAll('.door-btn').forEach(d => {
        if(d !== btn) d.classList.add('door-vanish');
        else d.classList.add('door-selected');
    });
    
    document.getElementById('door-title').style.opacity = '0';

    // 2. Логика награды и рейтинга
    setTimeout(() => {
        const playerName = prompt("Путник, назови своё имя для летописи Магистратума:") || "Анонимный Алхимик";
        
        // Сохраняем в рейтинг
        leaderBoard.push({ name: playerName, reward: reward, date: new Date().toLocaleDateString() });
        localStorage.setItem('alchemist_rating', JSON.stringify(leaderBoard));

        // Выводим финальное сообщение с цитатой
        const msg = document.getElementById('final-message');
        msg.innerHTML = `
            <p style="font-size: 1.5em; color: #f6ad55;">${rewards[reward]}</p>
            <hr style="border-color: #3d4b5c; margin: 20px 0;">
            <h3>ЛЕГЕНДЫ МАГИСТРАТУМА:</h3>
            <div id="leaderboard-list" style="text-align: left; max-height: 200px; overflow-y: auto; font-size: 0.9em;">
                ${leaderBoard.slice(-5).reverse().map(entry => `<div>• ${entry.name} — ${entry.reward} (${entry.date})</div>`).join('')}
            </div>
        `;
        msg.classList.remove('hidden');
    }, 800);
}

    function quitGame() {
        document.getElementById('screen-start').innerHTML = "<h2>ПУТЬ ЗАКРЫТ</h2><p class='mystic-text'>Возвращайся, когда проснется жажда Истины.</p>";
    }
</script>
</body>
</html>
