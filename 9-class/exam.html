<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERS | ТРЕНАЖЕР ОГЭ</title>
    <style>
        :root { --accent: #00d4ff; --bg: #0a0f1d; --card: #111827; --success: #10b981; --error: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        header { background: #111827; width: 100%; text-align: center; padding: 15px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .nav-top { width: 100%; display: flex; justify-content: space-between; padding: 10px 20px; box-sizing: border-box; background: #000; }
        .btn-root { color: var(--accent); text-decoration: none; font-weight: bold; font-size: 0.8rem; border: 1px solid var(--accent); padding: 5px 10px; border-radius: 5px; }
        .container { width: 95%; max-width: 800px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .tools { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; }
        .tool-btn { flex: 1; background: #1f2937; border: 1px solid var(--accent); color: #fff; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        #exam-menu { display: grid; grid-template-columns: 1fr; gap: 15px; width: 100%; }
        .topic-btn { background: var(--card); border: 1px solid #374151; padding: 20px; border-radius: 12px; cursor: pointer; text-align: left; transition: 0.3s; }
        .topic-btn:hover { border-color: var(--accent); background: rgba(0,212,255,0.05); }
        #quiz-zone { display: none; width: 100%; flex-direction: column; }
        .q-card { background: var(--card); padding: 25px; border-radius: 15px; border-left: 6px solid var(--accent); margin-bottom: 20px; }
        .opt-btn { background: #1f2937; border: 1px solid #374151; color: #fff; padding: 15px; border-radius: 10px; cursor: pointer; text-align: left; transition: 0.2s; font-size: 1rem; margin-bottom: 10px; width: 100%; }
        .opt-btn.correct { background: var(--success) !important; color: #000; font-weight: bold; }
        .opt-btn.wrong { background: var(--error) !important; color: #fff; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; cursor: pointer; }
        .modal-img { max-width: 95%; max-height: 90%; border: 2px solid var(--accent); border-radius: 10px; box-shadow: 0 0 30px var(--accent); }
        #progress-bar { width: 100%; height: 6px; background: #1f2937; margin-bottom: 20px; border-radius: 10px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: var(--accent); transition: 0.4s; }
    </style>
</head>
<body>

    <div class="nav-top">
        <a href="../index.html" class="btn-root">← ВЫХОД</a>
        <div id="score-box" style="color:var(--accent); font-weight:bold;">БАЛЛЫ: 0</div>
    </div>

    <header><h1>ТРЕНАЖЕР ОГЭ • UNIVERS</h1></header>

    <div class="container">
        <div class="tools">
            <button class="tool-btn" onclick="openMod('m-modal')">⚛️ Таблица Менделеева</button>
            <button class="tool-btn" onclick="openMod('s-modal')">💧 Растворимость</button>
        </div>

        <div id="progress-bar"><div id="progress-fill"></div></div>

        <div id="exam-menu">
            <div class="topic-btn" onclick="runQuiz('atom')"><h3>01. Строение атома</h3><p>Ядро, электроны, уровни</p></div>
            <div class="topic-btn" onclick="runQuiz('periodic')"><h3>02. Периодический закон</h3><p>Изменение свойств элементов</p></div>
            <div class="topic-btn" onclick="runQuiz('valency')"><h3>03. Степень окисления</h3><p>Определение зарядов ионов</p></div>
        </div>

        <div id="quiz-zone">
            <div class="q-card"><p id="q-txt" style="font-size:1.1rem;"></p></div>
            <div id="opt-grid"></div>
            <button class="tool-btn" style="margin-top:20px; border:none; opacity:0.5;" onclick="location.reload()">← Назад к темам</button>
        </div>
    </div>

    <!-- МОДАЛКИ С ЛОКАЛЬНЫМИ ФАЙЛАМИ -->
    <div id="m-modal" class="modal" onclick="this.style.display='none'">
        <img class="modal-img" src="mendeleev.jpg" onerror="this.src='https://thepresentation.ru'">
    </div>
    <div id="s-modal" class="modal" onclick="this.style.display='none'">
        <img class="modal-img" src="solubility.jpg" onerror="this.src='https://himya.ru'">
    </div>

<script>
    const db = {
        atom: [
            { q: "Число электронов во внешнем слое атома фосфора:", a: ["5", "3", "15", "31"], c: 0 },
            { q: "Атом какого элемента имеет 3 электронных слоя?", a: ["Li", "Al", "Be", "O"], c: 1 }
        ],
        periodic: [
            { q: "Наибольшей электроотрицательностью обладает:", a: ["Si", "P", "S", "Cl"], c: 3 },
            { q: "Радиус атома в ряду F -> O -> N -> C:", a: ["Увеличивается", "Уменьшается", "Не меняется"], c: 0 }
        ],
        valency: [
            { q: "Степень окисления азота в HNO3:", a: ["+3", "+5", "-3", "+4"], c: 1 },
            { q: "В соединении SO2 степень окисления серы:", a: ["-2", "+2", "+4", "+6"], c: 2 }
        ]
    };

    let curSet = [], curIdx = 0, pts = 0;

    function openMod(id) { document.getElementById(id).style.display = 'flex'; }

    function runQuiz(t) {
        curSet = db[t]; curIdx = 0; pts = 0;
        document.getElementById('exam-menu').style.display = 'none';
        document.getElementById('quiz-zone').style.display = 'flex';
        showQ();
    }

    function showQ() {
        const d = curSet[curIdx];
        document.getElementById('q-txt').innerText = d.q;
        const g = document.getElementById('opt-grid'); g.innerHTML = '';
        d.a.forEach((o, i) => {
            const b = document.createElement('button'); b.className = 'opt-btn'; b.innerText = o;
            b.onclick = () => {
                const btns = document.querySelectorAll('.opt-btn');
                btns.forEach(x => x.disabled = true);
                if(i === d.c) { b.classList.add('correct'); pts++; document.getElementById('score-box').innerText = 'БАЛЛЫ: '+pts; }
                else { b.classList.add('wrong'); btns[d.c].classList.add('correct'); }
                setTimeout(() => {
                    curIdx++;
                    if(curIdx < curSet.length) showQ();
                    else { alert("Баллы: " + pts); location.reload(); }
                }, 1200);
            };
            g.appendChild(b);
        });
        document.getElementById('progress-fill').style.width = (curIdx / curSet.length * 100) + '%';
    }
</script>
</body>
</html>
