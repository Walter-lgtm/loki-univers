<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERS | ФИПИ КЕЙС 23</title>
    <style>
        html, body { background: #0a0f1d !important; color: #fff !important; margin: 

0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { background: #111827; width: 100%; text-align: center; padding: 15px; border-bottom: 2px solid #00d4ff; }
        .task-card { background: #16203a; padding: 20px; margin: 15px; border-radius: 12px; border-left: 5px solid #00d4ff; max-width: 600px; font-size: 0.9rem; line-height: 1.4; }
        
        /* СКЛЯНКИ */
        .lab-area { display: flex; gap: 30px; margin: 20px; justify-content: center; width: 100%; }
        .flask-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .flask { width: 60px; height: 140px; border: 3px solid #fff; border-radius: 0 0 30px 30px; position: relative; background: rgba(255,255,255,0.1); overflow: hidden; }
        .liq { position: absolute; bottom: 0; width: 100%; height: 30%; background: rgba(0,212,255,0.3); transition: 0.5s; }
        .eff { position: absolute; bottom: 0; width: 100%; height: 0; transition: 1s; z-index: 5; }

        .reagents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 90%; max-width: 500px; }
        button { background: #1f2937; border: 1px solid #00d4ff; color: #fff; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:disabled { opacity: 0.3; }
        .btn-check { background: #10b981; color: #000; width: 90%; max-width: 500px; margin: 20px; padding: 15px; border-radius: 10px; border: none; font-weight: bold; display: none; }
        
        #log { width: 90%; max-width: 500px; background: #111827; padding: 15px; border-radius: 10px; text-align: center; color: #00d4ff; min-height: 50px; }
    </style>
</head>
<body>

<header><h1>ПРАКТИКУМ ФИПИ (Задание 23)</h1></header>

<div class="task-card" id="task-text">
    <b>КЕЙС №1:</b> В склянках №1 и №2 находятся <b>KOH</b> и <b>ZnSO4</b>. <br>
    Используя реактивы: <b>Fe, K3PO4, AlCl3</b>, определите содержимое каждой склянки.
</div>

<div class="lab-area">
    <div class="flask-wrap">
        <span>Склянка №1</span>
        <div class="flask"><div id="liq1" class="liq"></div><div id="eff1" class="eff"></div></div>
    </div>
    <div class="flask-wrap">
        <span>Склянка №2</span>
        <div class="flask"><div id="liq2" class="liq"></div><div id="eff2" class="eff"></div></div>
    </div>
</div>

<div id="log">Выберите реактив для проведения опытов</div>

<div class="reagents" id="reagents-box">
    <button onclick="conduct('Fe')">Железо (Fe)</button>
    <button onclick="conduct('K3PO4')">K3PO4</button>
    <button onclick="conduct('AlCl3')">AlCl3</button>
</div>

<button class="btn-check" id="final-btn" onclick="showResult()">СДЕЛАТЬ ВЫВОД</button>

<script>
    let step = 0;
    // Скрытая истина (Склянка 1 - KOH, Склянка 2 - ZnSO4)
    const hidden = { s1: 'KOH', s2: 'ZnSO4' };

    function conduct(reagent) {
        const log = document.getElementById('log');
        const e1 = document.getElementById('eff1');
        const e2 = document.getElementById('eff2');

        if (reagent === 'AlCl3') {
            // Реакция с KOH (Склянка 1) - белый амфотерный осадок
            e1.style.height = "30%"; e1.style.background = "#fff";
            // Реакция с ZnSO4 (Склянка 2) - нет признаков (в рамках ОГЭ)
            log.innerHTML = "<b>Результат AlCl3:</b><br>Склянка №1: Белый осадок Al(OH)3↓<br>Склянка №2: Без видимых признаков";
        } 
        else if (reagent === 'K3PO4') {
            // Реакция с ZnSO4 (Склянка 2) - белый осадок фосфата цинка
            e2.style.height = "30%"; e2.style.background = "#f0f0f0";
            log.innerHTML = "<b>Результат K3PO4:</b><br>Склянка №1: Без видимых признаков<br>Склянка №2: Белый осадок Zn3(PO4)2↓";
        }
        else {
            log.innerHTML = "<b>Результат Fe:</b><br>В обеих склянках признаки реакции отсутствуют.";
        }
        
        document.getElementById('final-btn').style.display = 'block';
    }

    function showResult() {
        alert("ВЫВОД (Задание 23):\nСклянка №1 содержит Гидроксид калия (KOH),\nСклянка №2 содержит Сульфат цинка (ZnSO4).\n\nУравнение для №1: 3KOH + AlCl3 = Al(OH)3↓ + 3KCl");
        location.reload();
    }
</script>

</body>
</html>
