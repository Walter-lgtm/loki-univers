<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERS | ТРЕНАЖЕР ЗАДАНИЯ 23</title>
    <style>
        :root { --accent: #00d4ff; --bg: #0a0f1d; --card: #16203a; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Меню выбора задач */
        #task-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 800px; padding: 20px; }
        .task-btn { background: var(--card); border: 1px solid var(--accent); color: white; padding: 15px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .task-btn:hover { background: var(--accent); color: #000; font-weight: bold; }

        /* Экран лаборатории */
        #lab-screen { display: none; width: 100%; max-width: 600px; flex-direction: column; align-items: center; }
        .task-text { background: var(--card); padding: 20px; border-radius: 15px; border-left: 5px solid var(--accent); margin-bottom: 20px; }
        
        .vessel { width: 60px; height: 160px; border: 3px solid #fff; border-radius: 0 0 30px 30px; position: relative; background: rgba(255,255,255,0.05); margin: 20px; }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 0; transition: 0.5s; border-radius: 0 0 25px 25px; }
        .precipitate { position: absolute; bottom: 0; width: 100%; height: 0; transition: 1s; border-radius: 0 0 25px 25px; }

        .reagents-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
        .reagent-btn { background: transparent; border: 1px solid rgba(0,212,255,0.4); color: white; padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
        .reagent-btn:disabled { opacity: 0.2; }
        
        .controls { display: flex; gap: 10px; margin-top: 20px; width: 100%; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-back { background: #4b5563; color: white; }
        .btn-mix { background: var(--accent); color: #000; }
        
        #result-msg { margin-top: 15px; text-align: center; font-weight: bold; min-height: 40px; }
    </style>
</head>
<body>

<h2 id="main-title">ВЫБОР ЗАДАНИЯ №23</h2>

<!-- МЕНЮ ЗАДАЧ -->
<div id="task-menu">
    <!-- Кнопки генерируются скриптом -->
</div>

<!-- ЭКРАН ЛАБОРАТОРИИ -->
<div id="lab-screen">
    <div class="task-text" id="task-desc"></div>
    
    <div class="vessel">
        <div id="liquid" class="liquid" style="background: rgba(0,212,255,0.2);"></div>
        <div id="precipitate" class="precipitate"></div>
    </div>

    <div id="result-msg">Выберите реактивы</div>

    <div class="reagents-grid" id="reagents-container"></div>

    <div class="controls">
        <button class="btn btn-back" onclick="showMenu()">← В МЕНЮ</button>
        <button class="btn btn-mix" id="mix-btn" style="display:none;" onclick="runExperiment()">СМЕШАТЬ</button>
    </div>
</div>

<script>
    const database = [
        { id: 1, title: "Задача 1: Сульфаты", base: "MgSO4", baseName: "сульфата магния", target: "BaCl2", effect: "#ffffff", msg: "Верно! Белый кристаллический осадок BaSO4.", eq: "MgSO4 + BaCl2 → BaSO4↓ + MgCl2", list: ["MgSO4", "BaCl2", "NaOH", "HCl", "AgNO3", "Cu"] },
        { id: 2, title: "Задача 2: Хлориды", base: "HCl", baseName: "соляной кислоты", target: "AgNO3", effect: "#f0f0f0", msg: "Верно! Белый творожистый осадок AgCl.", eq: "HCl + AgNO3 → AgCl↓ + HNO3", list: ["HCl", "AgNO3", "BaCl2", "KOH", "Zn", "H2SO4"] },
        { id: 3, title: "Задача 3: Карбонаты", base: "Na2CO3", baseName: "карбоната натрия", target: "HCl", effect: "bubbles", msg: "Верно! Бурное выделение углекислого газа CO2↑.", eq: "Na2CO3 + 2HCl → 2NaCl + H2O + CO2↑", list: ["Na2CO3", "HCl", "CaCl2", "NaOH", "Fe", "K2SO4"] }
    ];

    let currentTask = null;
    let selected = [];

    const menu = document.getElementById('task-menu');
    const lab = document.getElementById('lab-screen');

    // Генерация меню
    database.forEach(t => {
        let b = document.createElement('button');
        b.className = 'task-btn';
        b.innerText = t.title;
        b.onclick = () => startTask(t.id);
        menu.appendChild(b);
    });

    function startTask(id) {
        currentTask = database.find(x => x.id === id);
        selected = [];
        menu.style.display = 'none';
        lab.style.display = 'flex';
        document.getElementById('main-title').innerText = currentTask.title;
        document.getElementById('task-desc').innerHTML = `Дано вещество: <b>${currentTask.baseName}</b>. Подберите реактив для качественной реакции.`;
        resetLab();
        renderReagents();
    }

    function renderReagents() {
        const container = document.getElementById('reagents-container');
        container.innerHTML = '';
        currentTask.list.forEach(r => {
            let b = document.createElement('button');
            b.className = 'reagent-btn';
            b.innerText = r;
            b.onclick = () => selectR(r, b);
            container.appendChild(b);
        });
    }

    function selectR(name, btn) {
        if (selected.length < 2 && !selected.includes(name)) {
            selected.push(name);
            btn.style.background = "var(--accent)";
            btn.style.color = "#000";
            document.getElementById('liquid').style.height = (selected.length * 35) + '%';
            if (selected.length === 2) document.getElementById('mix-btn').style.display = 'block';
        }
    }

    function runExperiment() {
        const p = document.getElementById('precipitate');
        const msg = document.getElementById('result-msg');
        
        if (selected.includes(currentTask.base) && selected.includes(currentTask.target)) {
            if(currentTask.effect === 'bubbles') {
                msg.innerHTML = `<span style="color:var(--accent)">${currentTask.msg}</span><br><small>${currentTask.eq}</small>`;
                // Тут можно добавить анимацию пузырьков
            } else {
                p.style.height = '25%';
                p.style.background = currentTask.effect;
                msg.innerHTML = `<span style="color:var(--accent)">${currentTask.msg}</span><br><small>${currentTask.eq}</small>`;
            }
        } else {
            msg.innerHTML = "<span style='color:#ff4757'>Признаков реакции нет или реактив выбран неверно.</span>";
        }
        document.getElementById('mix-btn').style.display = 'none';
    }

    function showMenu() {
        menu.style.display = 'grid';
        lab.style.display = 'none';
        document.getElementById('main-title').innerText = "ВЫБОР ЗАДАНИЯ №23";
    }

    function resetLab() {
        document.getElementById('liquid').style.height = '0';
        document.getElementById('precipitate').style.height = '0';
        document.getElementById('result-msg').innerText = "Выберите реактивы";
        document.getElementById('mix-btn').style.display = 'none';
    }
</script>

</body>
</html>
