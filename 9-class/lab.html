<!DOCTYPE html>
<html lang="ru" style="background-color: #0a0f1d !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERS | LABORATORY 

9</title>
    <style>
        /* ПОЛНЫЙ СБРОС */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            background-color: #0a0f1d !important; 
            background: #0a0f1d !important;
            color: #ffffff !important;
            font-family: sans-serif;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #main-title { padding: 20px; color: #00d4ff; text-transform: uppercase; letter-spacing: 2px; }

        /* МЕНЮ */
        #task-menu { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 15px; width: 90%; max-width: 800px; padding: 20px; 
        }
        .task-btn { 
            background: #16203a; border: 1px solid #00d4ff; color: #fff; 
            padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; 
        }

        /* ЛАБОРАТОРИЯ */
        #lab-screen { display: none; width: 95%; max-width: 500px; flex-direction: column; align-items: center; }
        
        .task-card { 
            background: #16203a; padding: 15px; border-radius: 10px; 
            border-left: 5px solid #00d4ff; margin-bottom: 20px; width: 100%;
        }

        /* ПРОБИРКА - КОНТРАСТ */
        .vessel { 
            width: 70px; height: 180px; 
            border: 3px solid #ffffff !important; /* Яркий белый контур */
            border-radius: 0 0 35px 35px; 
            position: relative; 
            background: rgba(255,255,255,0.1); 
            margin: 20px 0;
            overflow: hidden;
        }
        
        .liquid { position: absolute; bottom: 0; width: 100%; height: 0; transition: 0.8s; background: rgba(0, 212, 255, 0.6); }
        .precipitate { position: absolute; bottom: 0; width: 100%; height: 0; transition: 1s; z-index: 5; }

        /* КНОПКИ РЕАКТИВОВ */
        .reagents-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
        .reagent-btn { background: #1e293b; border: 1px solid #00d4ff; color: #fff; padding: 12px; border-radius: 8px; cursor: pointer; }
        
        .btn-mix { 
            background: #2ed573; color: #000; padding: 15px; width: 100%; 
            border-radius: 25px; border: none; font-weight: bold; margin-top: 20px; display: none;
        }
        .btn-back { margin-top: 15px; color: #aaa; background: none; border: none; cursor: pointer; text-decoration: underline; }

        #msg { margin: 15px 0; text-align: center; color: #00d4ff; font-weight: bold; min-height: 40px; }
    </style>
</head>
<body>

    <h1 id="main-title">ЗАДАНИЕ №23</h1>

    <div id="task-menu">
        <button class="task-btn" onclick="start(1)">Задача 1: Сульфаты</button>
        <button class="task-btn" onclick="start(2)">Задача 2: Хлориды</button>
        <button class="task-btn" onclick="start(3)">Задача 3: Медь (II)</button>
        <button class="task-btn" onclick="start(4)">Задача 4: Железо (III)</button>
    </div>

    <div id="lab-screen">
        <div class="task-card" id="desc"></div>
        
        <div class="vessel">
            <div id="liq" class="liquid"></div>
            <div id="pre" class="precipitate"></div>
        </div>

        <div id="msg">Выберите реактивы</div>
        <div id="btns" class="reagents-grid"></div>

        <button id="mix" class="btn-mix" onclick="run()">ПРОВЕСТИ ОПЫТ</button>
        <button class="btn-back" onclick="location.reload()">← НАЗАД К ВЫБОРУ</button>
    </div>

<script>
    const db = [
        { id:1, name:"MgSO4", target:"BaCl2", color:"#fff", msg:"Белый осадок BaSO4↓", list:["MgSO4","BaCl2","NaOH","HCl","AgNO3","Zn"] },
        { id:2, name:"HCl", target:"AgNO3", color:"#eee", msg:"Белый творожистый осадок AgCl↓", list:["HCl","AgNO3","BaCl2","NaOH","Mg","Cu"] },
        { id:3, name:"CuSO4", target:"NaOH", color:"#0077ff", msg:"Синий студенистый осадок Cu(OH)2↓", list:["CuSO4","NaOH","BaCl2","HCl","Zn","AgNO3"] },
        { id:4, name:"FeCl3", target:"NaOH", color:"#8b4513", msg:"Бурый осадок Fe(OH)3↓", list:["FeCl3","NaOH","AgNO3","HCl","Mg","K2SO4"] }
    ];

    let cur = null, sel = [];

    function start(id) {
        cur = db.find(x => x.id === id);
        sel = [];
        document.getElementById('task-menu').style.display = 'none';
        document.getElementById('lab-screen').style.display = 'flex';
        document.getElementById('desc').innerHTML = `<b>Докажите наличие ионов в:</b> ${cur.name}`;
        
        const box = document.getElementById('btns');
        box.innerHTML = '';
        cur.list.forEach(r => {
            let b = document.createElement('button');
            b.className = 'reagent-btn';
            b.innerText = r;
            b.onclick = () => {
                if(sel.length < 2 && !sel.includes(r)) {
                    sel.push(r);
                    b.style.background = "#00d4ff"; b.style.color = "#000";
                    document.getElementById('liq').style.height = (sel.length * 40) + '%';
                    if(sel.length === 2) document.getElementById('mix').style.display = 'block';
                }
            };
            box.appendChild(b);
        });
    }

    function run() {
        if(sel.includes(cur.name) && sel.includes(cur.target)) {
            document.getElementById('pre').style.height = '30%';
            document.getElementById('pre').style.background = cur.color;
            document.getElementById('msg').innerHTML = `<span style="color:#2ed573">${cur.msg}</span>`;
        } else {
            document.getElementById('msg').innerHTML = `<span style="color:#ff4757">Реакция не идет!</span>`;
        }
        document.getElementById('mix').style.display = 'none';
    }
</script>
</body>
</html>
