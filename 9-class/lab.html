<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERS | ОГЭ ТИП 23</title>
    <style>
        /* Жесткая блокировка белого фона */
        html, body { 
            background-color: #

0a0f1d !important; 
            background: #0a0f1d !important;
            color: #ffffff !important; 
            margin: 0; padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }
        header { text-align: center; padding: 20px; width: 100%; background: #111827; border-bottom: 2px solid #00d4ff; }
        h1 { color: #00d4ff; margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }

        #task-menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 20px; }
        .btn-task { background: #1f2937; border: 2px solid #00d4ff; color: #fff; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 140px; }

        #lab-view { display: none; width: 90%; max-width: 400px; flex-direction: column; align-items: center; margin-top: 20px; }
        .card { background: #111827; padding: 15px; border-radius: 10px; width: 100%; border-left: 5px solid #00d4ff; margin-bottom: 15px; }

        /* ПРОБИРКА - МАКСИМАЛЬНАЯ ВИДИМОСТЬ */
        .vessel { 
            width: 70px; height: 180px; 
            border: 4px solid #ffffff !important; /* Яркий белый контур */
            border-radius: 0 0 35px 35px; position: relative; 
            background: rgba(255,255,255,0.15) !important; 
            overflow: hidden; margin: 20px;
            box-shadow: 0 0 15px rgba(0,212,255,0.4);
        }
        .liq { position: absolute; bottom: 0; width: 100%; height: 0; transition: 0.5s; background: rgba(0, 212, 255, 0.7); }
        .pre { position: absolute; bottom: 0; width: 100%; height: 0; transition: 1s; z-index: 10; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
        .btn-reagent { background: #374151; border: 1px solid #00d4ff; color: #fff; padding: 12px 2px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        
        .btn-mix { background: #10b981; color: #000; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: 20px; display: none; cursor: pointer; }
        .btn-nav { margin-top: 20px; background: none; color: #9ca3af; border: 1px solid #4b5563; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body style="background-color: #0a0f1d !important;"> <!-- Дублируем фон прямо в тег -->

    <header>
        <h1>ЗАДАНИЯ ОГЭ ТИП 23</h1>
    </header>

    <div id="task-menu">
        <button class="btn-task" onclick="init(0)">ЗАДАЧА 1</button>
        <button class="btn-task" onclick="init(1)">ЗАДАЧА 2</button>
        <button class="btn-task" onclick="init(2)">ЗАДАЧА 3</button>
        <button class="btn-task" onclick="init(3)">ЗАДАЧА 4</button>
    </div>

    <div id="lab-view">
        <div class="card" id="info"></div>
        <div class="vessel">
            <div id="liq" class="liq"></div>
            <div id="pre" class="pre"></div>
        </div>
        <div id="msg" style="color:#00d4ff; font-weight:bold; text-align:center; margin-bottom:10px;">Выберите 2 реактива</div>
        <div id="grid" class="grid"></div>
        <button id="mix" class="btn-mix" onclick="check()">СМЕШАТЬ РЕАКТИВЫ</button>
        <button class="btn-nav" onclick="location.reload()">В МЕНЮ ВЫБОРА</button>
    </div>

<script>
    // Принудительная установка фона через JS для гарантии
    document.body.style.backgroundColor = "#0a0f1d";

    const data = [
        { n: "MgSO4", t: "BaCl2", res: "БЕЛЫЙ ОСАДОК BaSO4↓", c: "#ffffff", list: ["MgSO4", "BaCl2", "NaOH", "HCl", "AgNO3", "Zn"] },
        { n: "HCl", t: "AgNO3", res: "БЕЛЫЙ ТВОРОЖИСТЫЙ AgCl↓", c: "#f0f0f0", list: ["HCl", "AgNO3", "BaCl2", "NaOH", "Mg", "Cu"] },
        { n: "CuSO4", t: "NaOH", res: "СИНИЙ ОСАДОК Cu(OH)2↓", c: "#0077ff", list: ["CuSO4", "NaOH", "BaCl2", "HCl", "Zn", "AgNO3"] },
        { n: "FeCl3", t: "NaOH", res: "БУРЫЙ ОСАДОК Fe(OH)3↓", c: "#8b4513", list: ["FeCl3", "NaOH", "AgNO3", "HCl", "Mg", "K2SO4"] }
    ];

    let active = null, sel = [];

    function init(idx) {
        active = data[idx]; sel = [];
        document.getElementById('task-menu').style.display = 'none';
        document.getElementById('lab-view').style.display = 'flex';
        document.getElementById('info').innerHTML = "Докажите наличие ионов в <br><b>" + active.n + "</b>";
        
        const g = document.getElementById('grid');
        g.innerHTML = '';
        active.list.forEach(r => {
            let b = document.createElement('button');
            b.className = 'btn-reagent'; b.innerText = r;
            b.onclick = () => {
                if(sel.length < 2 && !sel.includes(r)) {
                    sel.push(r);
                    b.style.background = "#00d4ff"; b.style.color = "#000";
                    document.getElementById('liq').style.height = (sel.length * 40) + '%';
                    if(sel.length === 2) document.getElementById('mix').style.display = 'block';
                }
            };
            g.appendChild(b);
        });
    }

    function check() {
        if(sel.includes(active.n) && sel.includes(active.t)) {
            document.getElementById('pre').style.height = '30%';
            document.getElementById('pre').style.background = active.c;
            document.getElementById('msg').innerHTML = "<span style='color:#10b981'>" + active.res + "</span>";
        } else {
            document.getElementById('msg').innerHTML = "<span style='color:#ef4444'>РЕАКЦИЯ НЕ ИДЕТ</span>";
        }
        document.getElementById('mix').style.display = 'none';
    }
</script>
</body>
</html>
